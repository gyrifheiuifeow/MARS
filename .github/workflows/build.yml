name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check task files
        run: python3 -m unittest discover -s tests -v
      - name: Build programs
        run: python3 scripts/build.py
      - name: Run C++ tests
        run: build/bin/mars_accept unit build/toy_acceptance
      - name: Check source hashes
        run: python3 scripts/verify_sources.py
      - name: Check saved results
        run: |
          python3 scripts/verify_raw_results.py
          python3 scripts/verify_results.py
